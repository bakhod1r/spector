name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt + vet + golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # testdata/broken/*.go are intentionally unparseable fixtures:
          # gofmt reports them on stderr and exits 2, so ignore its status.
          unformatted="$(gofmt -l . 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # A stale go.mod means `go get` was run without tidying, which shows up
      # as direct dependencies marked `// indirect`.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml is a `version: "2"` config, which only golangci-lint
          # v2 can read. The v6 action installs the newest v1 (1.64.8), and it
          # refuses the config outright: "the Go language version (go1.24) used
          # to build golangci-lint is lower than the targeted Go version".
          version: v2.6.0
