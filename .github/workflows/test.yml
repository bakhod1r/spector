name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -coverpkg is scoped to the packages this project ships. Without it the
      # examples and their generated protobuf stubs count as uncovered code,
      # which drags the total below the floor for demo files nothing tests.
      - name: Test (race + coverage)
        run: |
          pkgs="$(go list ./... | grep -v -e '/examples/' -e '/benchmarks' | paste -sd, -)"
          go test -race -coverpkg="$pkgs" -coverprofile=coverage.out ./...

      - name: Coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')"
          echo "total coverage: ${total}%"
          # Guards against a large regression, not against every percentage
          # point — raise it deliberately, never lower it to make CI green.
          if [ "$(echo "$total < 90" | bc -l)" -eq 1 ]; then
            echo "coverage ${total}% is below the 90% floor"
            exit 1
          fi

  integration:
    name: Integration (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Drives the compiled CLI against the example API. Gated behind the
      # `integration` tag so it never runs in the default unit job.
      - name: Integration tests
        run: go test -tags integration ./tests/

  bench:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # -benchtime=1x runs each benchmark once: this proves they still compile
      # and run, without spending CI minutes on stable timing numbers.
      - name: Run benchmarks once
        run: go test -run '^$' -bench . -benchtime=1x -benchmem ./benchmarks/

  # A dependency advisory is a test failure that arrives without a code change,
  # so it is checked on every run rather than at release time. govulncheck
  # reports only the vulnerabilities this code actually reaches.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest: an upstream govulncheck release must not be able
      # to break CI on a commit that changed nothing. The advisory database is
      # still fetched fresh on every run, so new vulnerabilities are still
      # caught — only the tool itself is held still, and dependabot moves it.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
