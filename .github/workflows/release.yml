name: Release

on:
  push:
    tags: ['v*']

permissions:
  # goreleaser uploads the archives to the release it creates.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and the changelog range from tags,
          # and a shallow clone has none of them.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag that does not build is a broken release that cannot be unpublished,
      # so the suite runs before anything is uploaded.
      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
